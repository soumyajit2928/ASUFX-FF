name: FF Calendar

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 6:00 AM IST, Mon-Fri (daily "today" digest)
    - cron: "30 1 * * 0"     # 7:00 AM IST Sunday (weekly preview)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ github.event.schedule == '30 1 * * 0' && 'week' || 'today' }}
        run: python ff_calendar.py
